server {
    # 8080, not 80: the image runs unprivileged and cannot bind a low port.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;

    # TanStack Start's SPA mode prerenders the shell as `_shell.html`, not
    # `index.html`. Getting this wrong gives a working "/" and a 404 on every
    # refresh of any other route.
    index _shell.html;

    # Security headers live in a snippet included by every location, not here.
    # nginx drops server-level `add_header`s from any location that sets one of
    # its own — which all of them below do — so declared here they never
    # reached a single response.
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    # Mock Service Worker. Two rules matter here:
    #  - it must be served from the root, or its scope cannot cover /api;
    #  - it must never be cached, or a stale worker keeps intercepting after a
    #    deploy and serves yesterday's mock API.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed filenames: safe to cache forever, and a new build gets new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The shell itself is never cached, so a deploy is picked up immediately.
    location = /_shell.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # History fallback: any unmatched path is a client route.
    location / {
        try_files $uri $uri/ /_shell.html;
    }

    # Container health, and a target for compose's healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }
}
